name: Concrete task
description: Suggest a bounded documentation, software, data or community task.
title: "[Task] "
labels:
  - task
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What concrete result is needed?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this needed now?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will contributors know the task is complete?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Note relevant data, decisions, legal constraints or blockers.
