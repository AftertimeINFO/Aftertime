name: aftertime

services:
  postgres:
    # PostGIS on the same PostgreSQL major version; existing data volumes stay compatible.
    image: postgis/postgis:17-3.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aftertime}
      POSTGRES_USER: ${POSTGRES_USER:-aftertime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aftertime-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aftertime} -d ${POSTGRES_DB:-aftertime}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aftertime:aftertime-local@postgres:5432/aftertime}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:8080,http://localhost:8083,http://localhost:5173}
    command: ["/app/docker-entrypoint.sh", "api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aftertime:aftertime-local@postgres:5432/aftertime}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SYNC_POLL_SECONDS: ${SYNC_POLL_SECONDS:-5}
    command: ["/app/docker-entrypoint.sh", "worker"]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8083:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
